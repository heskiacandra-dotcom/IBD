<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="120" y1="200" x2="392" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="80" y="80" width="352" height="352" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with App Icon Squircle Radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Icon Graphic with Depth Shadow -->
  <g filter="url(#shadow)">
    <!-- Main House Geometric Structure -->
    <path d="M256 112L120 224V384C120 392.837 127.163 400 136 400H376C384.837 400 392 392.837 392 384V224L256 112Z" fill="url(#roofGrad)"/>
    
    <!-- Modern Roof Overhang Accent -->
    <path d="M104 232L256 108L408 232" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Community Shield / Heart Node -->
    <rect x="216" y="272" width="80" height="96" rx="16" fill="#2563EB"/>
    
    <!-- Vibrant Emerald RT Node (Symbolizing Smart Citizen Harmony) -->
    <circle cx="256" cy="224" r="28" fill="#10B981" stroke="#FFFFFF" stroke-width="8"/>
    
    <!-- Window Nodes -->
    <circle cx="176" cy="272" r="14" fill="#93C5FD"/>
    <circle cx="336" cy="272" r="14" fill="#93C5FD"/>
  </g>
</svg>
