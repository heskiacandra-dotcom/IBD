<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mode Offline • Smart RT</title>
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      background: #EFF6FF;
      color: #2563EB;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.25rem; font-weight: 800; color: #0F172A; margin-bottom: 8px; }
    p { font-size: 0.875rem; color: #64748B; line-height: 1.6; margin-bottom: 24px; }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #2563EB;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-retry:hover { background: #1D4ED8; }
    .emergency-box {
      margin-top: 24px;
      padding: 16px;
      background: #FEF2F2;
      border: 1px solid #FEE2E2;
      border-radius: 12px;
      text-align: left;
    }
    .emergency-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #DC2626;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .emergency-contact {
      font-size: 0.8125rem;
      color: #991B1B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Koneksi Terputus (Offline)</h1>
    <p>Aplikasi Smart RT saat ini tidak dapat terhubung ke server. Periksa jaringan internet Anda lalu coba muat ulang.</p>
    
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
      <span>Muat Ulang Halaman</span>
    </button>

    <div class="emergency-box">
      <div class="emergency-title">Hotline Darurat Warga</div>
      <div class="emergency-contact">Ketua RT: 0812-3456-7890</div>
      <div class="emergency-contact">Polsek / Bhabinkamtibmas: 110</div>
      <div class="emergency-contact">Ambulans / Medis: 119</div>
    </div>
  </div>
</body>
</html>
